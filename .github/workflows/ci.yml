name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm validate
# A deploy job can be added once an instance is linked (phio link <name>):
# see the README's Deployment section — it needs PHIO_USERNAME/PHIO_PASSWORD
# repository secrets and runs `pnpm build && phio deploy`.
