name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight main run (it may be deploying).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Normally ~2 minutes. The headroom is for a cold apt cache on a slow
    # mirror, which must finish once to seed the cache; it still stops a
    # stalled run hours short of the 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # pnpm version resolves from the packageManager field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # install-deps pulls ~120 MB of .debs (mostly WebKit's media and font
      # stack) on every run, and the Azure apt mirror sometimes serves them at
      # dial-up speed (a 32-minute install on 2026-10-23). Keep apt's download
      # archive in a cached directory so it only fetches what changed since
      # the runner image last moved. ImageOS and ImageVersion are runner
      # environment variables, not workflow env, so a shell step reads them.
      - name: Resolve apt cache key
        id: apt
        run: |
          echo "prefix=apt-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "key=apt-$ImageOS-$ImageVersion-playwright-${{ steps.playwright.outputs.version }}" >> "$GITHUB_OUTPUT"

      # The *.deb glob skips apt's root-owned partial/ dir and lock file.
      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/apt-archives/*.deb
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.prefix }}

      - name: Point apt at the cached archive
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/.cache/apt-archives\";" \
            | sudo tee /etc/apt/apt.conf.d/99cached-archives

      - name: Install Playwright system deps
        run: pnpm exec playwright install-deps webkit chromium

      # Save as soon as the download lands, so a later test failure doesn't
      # throw away a slow fetch.
      - name: Save apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/apt-archives/*.deb
          key: ${{ steps.apt.outputs.key }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install webkit chromium

      # The e2e suite runs the built app under a local PocketBase
      # (scripts/pb.ts downloads the binary into .pb/ on first use).
      - name: Cache PocketBase
        uses: actions/cache@v4
        with:
          path: .pb/pocketbase-*
          key: pocketbase-${{ runner.os }}-${{ hashFiles('scripts/pb.ts') }}

      # Format check + typecheck + lint + election documents + unit tests +
      # e2e (which builds the app and the hooks bundle first).
      - run: pnpm validate

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install -g phio tsx
      - name: Restore phio deploy key
        # phio authenticates deploys with a persistent ed25519 keypair that
        # must match the account key at pockethost.io/account/keys; fresh
        # runners would otherwise generate a new, mismatched key every run.
        run: |
          mkdir -p ~/.config/phio-nodejs
          printf '%s' "$PHIO_DEPLOY_KEY" | base64 -d > ~/.config/phio-nodejs/phio_deploy_ed25519
          printf '%s' "$PHIO_DEPLOY_KEY_PUB" | base64 -d > ~/.config/phio-nodejs/phio_deploy_ed25519.pub
          chmod 600 ~/.config/phio-nodejs/phio_deploy_ed25519
        env:
          PHIO_DEPLOY_KEY: ${{ secrets.PHIO_DEPLOY_KEY }}
          PHIO_DEPLOY_KEY_PUB: ${{ secrets.PHIO_DEPLOY_KEY_PUB }}
      # The instance comes from the committed .phioconfig. phio uploads pb_*
      # only and never deletes remote files (see AGENTS.md).
      - run: phio deploy -v
        env:
          PHIO_USERNAME: ${{ secrets.PHIO_USERNAME }}
          PHIO_PASSWORD: ${{ secrets.PHIO_PASSWORD }}
          PHIO_PROJECT_DIR: ${{ github.workspace }}
      - name: Power cycle the instance
        # Hooks and migrations register at boot, so a deploy is not fully live
        # until the instance restarts. The PocketHost dashboard's power toggle
        # is PUT /api/instance/{id} on the mothership (a PocketBase app),
        # authenticated with the same account phio uses. The UA header
        # matters: the mothership sits behind Cloudflare rules that reject
        # non-browser agents.
        run: |
          node - <<'EOF'
          const fs = require('node:fs')
          const BASE = 'https://pockethost-central.pockethost.io'
          const HEADERS = {
            'User-Agent': 'Mozilla/5.0 (compatible; voting-deploy)',
            'Content-Type': 'application/json',
          }
          const die = (msg) => {
            console.error(msg)
            process.exit(1)
          }
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
          const main = async () => {
            let res = await fetch(`${BASE}/api/collections/users/auth-with-password`, {
              method: 'POST',
              headers: HEADERS,
              body: JSON.stringify({
                identity: process.env.PHIO_USERNAME,
                password: process.env.PHIO_PASSWORD,
              }),
            })
            if (!res.ok) die(`mothership login failed (${res.status})`)
            const { token } = await res.json()
            const auth = { ...HEADERS, Authorization: token }

            const name = JSON.parse(fs.readFileSync('.phioconfig', 'utf8')).instanceName
            const filter = encodeURIComponent(`subdomain='${name}' || cname='${name}'`)
            res = await fetch(`${BASE}/api/collections/instances/records?filter=${filter}`, { headers: auth })
            if (!res.ok) die(`instance lookup failed (${res.status})`)
            const { items } = await res.json()
            if (!items.length) die(`no instance named "${name}" on this account`)
            const id = items[0].id

            const power = async (on) => {
              const r = await fetch(`${BASE}/api/instance/${id}`, {
                method: 'PUT',
                headers: auth,
                body: JSON.stringify({ id, fields: { power: on } }),
              })
              if (!r.ok) die(`power ${on ? 'on' : 'off'} failed (${r.status})`)
              console.log(`power ${on ? 'on' : 'off'} ok`)
            }
            await power(false)
            await sleep(5000)
            await power(true)

            // Wake it and confirm it serves before calling the deploy done.
            for (let attempt = 1; attempt <= 12; attempt++) {
              await sleep(5000)
              try {
                const ping = await fetch(`https://${name}.pockethost.io/api/health`, { headers: HEADERS })
                console.log(`health check ${attempt}: ${ping.status}`)
                if (ping.ok) return
              } catch (err) {
                console.log(`health check ${attempt}: ${err.message}`)
              }
            }
            die('instance did not come back after power cycle')
          }
          main()
          EOF
        env:
          PHIO_USERNAME: ${{ secrets.PHIO_USERNAME }}
          PHIO_PASSWORD: ${{ secrets.PHIO_PASSWORD }}
      # Election documents are data, not code: push them only when a merge
      # changed elections/, so a code-only deploy never touches the rows. A
      # first push to main (no before commit), or one whose before commit is
      # gone (a force push), pushes them all.
      - name: Check for election document changes
        id: elections
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "${BEFORE//0/}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --depth=1 origin "$BEFORE"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BEFORE" HEAD -- elections/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push election documents
        if: steps.elections.outputs.changed == 'true'
        run: pnpm elections:push --url https://voting.pockethost.io
        env:
          PB_SUPERUSER_EMAIL: ${{ secrets.PHIO_USERNAME }}
          PB_SUPERUSER_PASSWORD: ${{ secrets.PHIO_PASSWORD }}
      # An early vote the hooks cannot pull (Elections BC's advance voting
      # PDF) is pushed from here on every deploy of main: the script parses
      # the PDFs with pdftotext and writes the row only when the counts
      # changed, so a repeat is a no-op and an amended table lands with the
      # next merge. Prints "nothing to push" once no document has such a feed.
      # The runner image's package index goes stale between image builds
      # (the 2026-10-23 deploy 404ed on poppler), so refresh it first.
      - name: Install pdftotext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Push the advance vote
        run: pnpm early-vote:push --all --url https://voting.pockethost.io
        env:
          PB_SUPERUSER_EMAIL: ${{ secrets.PHIO_USERNAME }}
          PB_SUPERUSER_PASSWORD: ${{ secrets.PHIO_PASSWORD }}
